<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Assistant</title>
<style>
  :root { --bg:#fbfbf9; --ink:#1d2330; --muted:#5d6678; --line:#d9dce3; --accent:#1f4fd8; --panel:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171f; --ink:#e8eaf0; --muted:#9aa3b5; --line:#2b3140; --accent:#7ea1ff; --panel:#1b1f2a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "Segoe UI", system-ui, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  p.sub { margin:0 0 28px; color:var(--muted); }
  label { display:block; font-weight:600; margin:20px 0 6px; }
  .row { display:flex; gap:8px; }
  input { flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); font:inherit; }
  button { padding:10px 16px; border:0; border-radius:6px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  :focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #status { min-height:1.5em; color:var(--muted); margin-top:8px; }
  #answer { margin-top:24px; padding:16px; border-left:4px solid var(--accent); background:var(--panel); white-space:pre-wrap; display:none; }
  #sources { margin-top:16px; display:none; }
  #sources h2 { font-size:1rem; margin:0 0 8px; }
  .src { padding:10px 0; border-top:1px solid var(--line); font-size:.92rem; color:var(--muted); }
  .src a { color:var(--accent); font-weight:600; margin-right:8px; }
</style>
</head>
<body>
<main>
  <h1>Ask a video anything</h1>
  <p class="sub">Add a YouTube video that has captions, then ask questions in English or Hindi.</p>

  <label for="url">YouTube link</label>
  <div class="row">
    <input id="url" placeholder="https://www.youtube.com/watch?v=...">
    <button id="add">Add video</button>
  </div>
  <div id="status" role="status"></div>

  <label for="q">Your question</label>
  <div class="row">
    <input id="q" placeholder="What does the speaker say about RAG?">
    <button id="ask">Ask</button>
  </div>

  <div id="answer"></div>
  <div id="sources"><h2>Where this came from</h2><div id="list"></div></div>
</main>
<script>
let videoId = null;
const $ = id => document.getElementById(id);
const setStatus = t => $("status").textContent = t;

async function post(path, body) {
  const r = await fetch(path, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  const data = await r.json();
  if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Check your input and try again.");
  return data;
}

$("add").onclick = async () => {
  $("add").disabled = true; setStatus("Fetching transcript and building the index...");
  try {
    const d = await post("/api/videos", { url: $("url").value.trim() });
    videoId = d.video_id;
    setStatus("Ready: indexed " + d.num_chunks + " chunks. Ask your question below.");
  } catch (e) { setStatus("Could not add video: " + e.message); }
  $("add").disabled = false;
};

$("ask").onclick = async () => {
  if (!videoId) { setStatus("Add a video first."); return; }
  $("ask").disabled = true; setStatus("Searching the video...");
  try {
    const d = await post("/api/ask", { video_id: videoId, question: $("q").value.trim() });
    $("answer").style.display = "block"; $("answer").textContent = d.answer;
    $("sources").style.display = "block"; $("list").replaceChildren();
    d.sources.forEach(s => {
      const div = document.createElement("div"); div.className = "src";
      const a = document.createElement("a"); a.href = s.link; a.target = "_blank"; a.rel = "noopener"; a.textContent = s.timestamp;
      div.append(a, s.text); $("list").append(div);
    });
    setStatus("");
  } catch (e) { setStatus("Could not answer: " + e.message); }
  $("ask").disabled = false;
};
</script>
</body>
</html>
